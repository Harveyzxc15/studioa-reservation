name: Alert N2

on:
  schedule:
    - cron: '10 2,4,6,8,10,12,14,16 * * *'  # 台灣 10/12/14/16/18/20/22/00，與北一區錯開 10 分鐘
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check (北二區)
        env:
          STUDIOA_TOKEN:       ${{ secrets.STUDIOA_TOKEN }}
          DISCORD_WEBHOOK_N2:  ${{ secrets.DISCORD_WEBHOOK_N2 }}
        run: python alert.py --region n2

      - name: Commit updated alert state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: n2 alert state $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push 失敗（第 $i 次），另一區可能同時在寫，稍後重試"
            sleep $((i * 5))
          done
