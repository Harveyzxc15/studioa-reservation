name: Report 北區合併（每 2 小時）

on:
  # 多重觸發：外部定時服務（主力）＋ Mac launchd（備援）＋ GitHub cron（最後備援）。
  # report.py 會檢查同時段是否已發送，重複觸發會自動略過。
  schedule:
    - cron: '17 2,4,6,8,10,12,14,16 * * *'  # 台灣 10/12/14/16/18/20/22/00 第 17 分；GitHub 常延遲，只當備援
  workflow_dispatch:

# 同時到的觸發排隊依序執行，後到的會讀到先到者寫入的 sent_slots.json 而略過
concurrency:
  group: reservation-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # 排隊的觸發會 checkout 到觸發當下的舊版本，先拉最新才讀得到前一個 run 寫入的 sent_slots.json
      - name: Pull latest state
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report
        env:
          STUDIOA_TOKEN:    ${{ secrets.STUDIOA_TOKEN }}
          DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
        run: python report.py --region all

      - name: Commit updated state & HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          git diff --cached --quiet || git commit -m "chore: 北區 daily report $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push 失敗（第 $i 次），另一區可能同時在寫，稍後重試"
            sleep $((i * 5))
          done
