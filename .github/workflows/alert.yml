name: Alert 北區合併

on:
  # 2026/09/13 起每個時段改發完整日報（daily_report.yml），異動通知排程停用，只留手動觸發。
  # 要恢復時把 schedule 加回來，並把 daily_report.yml 的時段改回一天一次，避免同時段重複發送。
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          STUDIOA_TOKEN:    ${{ secrets.STUDIOA_TOKEN }}
          DISCORD_WEBHOOK:  ${{ secrets.DISCORD_WEBHOOK }}
        run: python alert.py --region all

      - name: Commit updated alert state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: 北區 alert state $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push 失敗（第 $i 次），另一區可能同時在寫，稍後重試"
            sleep $((i * 5))
          done
