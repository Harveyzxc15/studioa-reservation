name: Daily Report N2 (10 AM)

on:
  schedule:
    - cron: '5 2 * * *'  # 每天 10:05 台灣時間（與北一區錯開 5 分鐘）
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report (北二區)
        env:
          STUDIOA_TOKEN:       ${{ secrets.STUDIOA_TOKEN }}
          DISCORD_WEBHOOK_N2:  ${{ secrets.DISCORD_WEBHOOK_N2 }}
        run: python report.py --region n2

      - name: Commit updated state & HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          git diff --cached --quiet || git commit -m "chore: n2 daily report $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "push 失敗（第 $i 次），另一區可能同時在寫，稍後重試"
            sleep $((i * 5))
          done
